<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日彩票开奖</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #e74c3c;
    --primary-dark: #c0392b;
    --text: #2c3e50;
    --muted: #95a5a6;
    --border: #e8e8f0;
    --green: #27ae60;
    --blue: #2980b9;
    --gold: #f39c12;
  }

  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .header {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
    color: #fff;
    padding: 30px 20px;
    text-align: center;
  }

  .header h1 {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .header .date {
    font-size: 15px;
    opacity: 0.9;
  }

  .container {
    max-width: 860px;
    margin: -20px auto 0;
    padding: 0 16px;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    padding: 22px;
    margin-bottom: 20px;
  }

  .card h2 {
    font-size: 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card h2::before {
    content: '';
    width: 4px;
    height: 18px;
    background: var(--primary);
    border-radius: 2px;
  }

  /* 今日开奖 */
  .today-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .today-item {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    transition: transform 0.15s;
  }

  .today-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  }

  .today-item .name {
    font-weight: 600;
    font-size: 16px;
  }

  .today-item .tag {
    display: inline-block;
    background: #fdecea;
    color: var(--primary);
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 10px;
    margin: 6px 0;
  }

  .today-item .time {
    color: var(--muted);
    font-size: 14px;
  }

  /* 开奖结果 */
  .result-group {
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px dashed var(--border);
  }

  .result-group:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }

  .result-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .result-head .name {
    font-weight: 600;
    font-size: 16px;
  }

  .result-head .issue {
    color: var(--muted);
    font-size: 13px;
  }

  .balls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .ball {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #fff;
  }

  .ball.red {
    background: linear-gradient(135deg, #e74c3c, #c0392b);
  }

  .ball.blue {
    background: linear-gradient(135deg, #3498db, #2980b9);
  }

  .ball.gray {
    background: linear-gradient(135deg, #7f8c8d, #6c7a7d);
  }

  /* 周程表 */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  th {
    background: #fafafa;
    color: var(--muted);
    font-weight: 500;
  }

  .today {
    background: #fdecea !important;
  }

  .today td:first-child {
    color: var(--primary);
    font-weight: 700;
  }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 4px;
  }

  .no-draw {
    color: #ccc;
  }

  /* 倒计时 */
  .countdown-box {
    text-align: center;
    padding: 10px;
  }

  .countdown-box .next {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .countdown-numbers {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .countdown-numbers span {
    background: #2c3e50;
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 8px;
    min-width: 52px;
  }

  .countdown-numbers .label {
    background: none;
    color: var(--muted);
    font-size: 13px;
    font-weight: 400;
    min-width: auto;
    padding: 10px 2px;
  }

  .notice {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    line-height: 1.6;
  }

  @media (max-width: 600px) {
    .ball {
      width: 32px;
      height: 32px;
      font-size: 13px;
    }
    .countdown-numbers span {
      font-size: 18px;
      min-width: 42px;
      padding: 8px 10px;
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🎯 每日彩票开奖</h1>
  <div class="date" id="headerDate"></div>
</div>

<div class="container">

  <!-- 今日开奖 -->
  <div class="card">
    <h2>今日开奖</h2>
    <div class="today-list" id="todayList"></div>
  </div>

  <!-- 开奖倒计时 -->
  <div class="card">
    <h2>开奖倒计时</h2>
    <div class="countdown-box">
      <div class="next" id="nextDrawText">加载中...</div>
      <div class="countdown-numbers">
        <span id="cdHour">00</span>
        <span class="label">时</span>
        <span id="cdMinute">00</span>
        <span class="label">分</span>
        <span id="cdSecond">00</span>
        <span class="label">秒</span>
      </div>
    </div>
  </div>

  <!-- 最近开奖结果 -->
  <div class="card">
    <h2>最近开奖结果 <span style="font-size:12px;color:var(--muted);font-weight:400;">（示例数据）</span></h2>
    <div id="results"></div>
  </div>

  <!-- 每周开奖日程 -->
  <div class="card">
    <h2>每周开奖日程</h2>
    <div style="overflow-x:auto;">
      <table id="scheduleTable"></table>
    </div>
  </div>

  <p class="notice">
    ⚠️ 本页面为演示页面，开奖结果数据为示例。真实数据请以官方渠道为准。<br>
    请理性购彩，量力而行。未满18周岁不得购买彩票。
  </p>
</div>

<script>
  // ============ 数据配置 ============
  // 彩票类型及每周开奖日（0=周日, 1=周一 ... 6=周六）
  const LOTTERIES = [
    { name: '双色球',   days: [0, 2, 4],    time: '21:15', color: 'red',  type: '福彩' },
    { name: '大乐透',   days: [1, 3, 6],    time: '21:25', color: 'blue', type: '体彩' },
    { name: '3D',       days: [0,1,2,3,4,5,6], time: '21:15', color: 'gray', type: '福彩' },
    { name: '排列三',   days: [0,1,2,3,4,5,6], time: '21:25', color: 'gray', type: '体彩' },
    { name: '排列五',   days: [0,1,2,3,4,5,6], time: '21:25', color: 'gray', type: '体彩' },
    { name: '七乐彩',   days: [1, 3, 5],    time: '21:15', color: 'red',  type: '福彩' },
    { name: '七星彩',   days: [0, 2, 5],    time: '21:25', color: 'gray', type: '体彩' },
    { name: '快乐8',    days: [0,1,2,3,4,5,6], time: '21:30', color: 'gray', type: '福彩' },
  ];

  const WEEK_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  // ============ 示例开奖结果 ============
  // 真实项目中可替换为 API 请求
  function fetchResults() {
    return [
      { name: '双色球', issue: '2025060', balls: ['03','07','12','19','24','30'], special: '08', ballType: 'red' },
      { name: '大乐透', issue: '2025071', balls: ['05','11','18','25','33'], special: '02 09', ballType: 'blue' },
      { name: '3D',      issue: '2025150', balls: ['5','8','2'], special: null, ballType: 'gray' },
    ];
  }

  // ============ 工具函数 ============
  function pad(n) { return String(n).padStart(2, '0'); }

  function formatDate(d) {
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${WEEK_NAMES[d.getDay()]}`;
  }

  // ============ 渲染头部日期 ============
  const now = new Date();
  document.getElementById('headerDate').textContent = formatDate(now);

  // ============ 渲染今日开奖 ============
  function renderToday() {
    const today = now.getDay();
    const container = document.getElementById('todayList');
    const todaysLots = LOTTERIES.filter(l => l.days.includes(today));

    if (todaysLots.length === 0) {
      container.innerHTML = '<p style="color:var(--muted);text-align:center;width:100%;">今天没有开奖的彩票</p>';
      return;
    }

    container.innerHTML = todaysLots.map(l => `
      <div class="today-item">
        <div class="name">${l.name}</div>
        <span class="tag">${l.type}</span>
        <div class="time">🕘 ${l.time} 开奖</div>
      </div>
    `).join('');
  }

  // ============ 渲染开奖结果 ============
  function renderResults() {
    const results = fetchResults();
    const container = document.getElementById('results');

    container.innerHTML = results.map(r => {
      const ballsHtml = r.balls.map(b => `<div class="ball ${r.ballType}">${b}</div>`).join('');
      const specialHtml = r.special
        ? `<div class="ball ${r.ballType}" style="opacity:0.85;">${r.special}</div>`
        : '';
      return `
        <div class="result-group">
          <div class="result-head">
            <span class="name">${r.name}</span>
            <span class="issue">第 ${r.issue} 期</span>
          </div>
          <div class="balls">${ballsHtml}${specialHtml}</div>
        </div>
      `;
    }).join('');
  }

  // ============ 渲染周程表 ============
  function renderSchedule() {
    const table = document.getElementById('scheduleTable');
    const today = now.getDay();

    let html = '<thead><tr><th>彩票</th>';
    WEEK_NAMES.forEach(w => { html += `<th>${w}</th>`; });
    html += '</tr></thead><tbody>';

    LOTTERIES.forEach(l => {
      const isToday = l.days.includes(today);
      html += `<tr class="${isToday ? 'today' : ''}">`;
      html += `<td>${l.name}</td>`;
      for (let i = 0; i < 7; i++) {
        if (l.days.includes(i)) {
          html += `<td><span class="dot"></span>${l.time}</td>`;
        } else {
          html += `<td class="no-draw">—</td>`;
        }
      }
      html += '</tr>';
    });

    html += '</tbody>';
    table.innerHTML = html;
  }

  // ============ 倒计时 ============
  function getNextDraw() {
    const today = now.getDay();
    let candidates = [];

    LOTTERIES.forEach(l => {
      l.days.forEach(day => {
        const [h, m] = l.time.split(':').map(Number);
        // 计算距离现在最近的开奖时间
        for (let offset = 0; offset < 8; offset++) {
          const target = new Date(now);
          target.setDate(now.getDate() + offset);
          if (target.getDay() !== day) continue;
          target.setHours(h, m, 0, 0);
          if (target > now) {
            candidates.push({ lottery: l, time: target });
            return;
          }
        }
      });
    });

    candidates.sort((a, b) => a.time - b.time);
    return candidates[0] || null;
  }

  function updateCountdown() {
    const next = getNextDraw();
    const textEl = document.getElementById('nextDrawText');

    if (!next) {
      textEl.textContent = '暂无即将开奖的彩票';
      return;
    }

    const diff = next.time - new Date();
    const totalSec = Math.floor(diff / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;

    document.getElementById('cdHour').textContent = pad(h);
    document.getElementById('cdMinute').textContent = pad(m);
    document.getElementById('cdSecond').textContent = pad(s);

    textEl.textContent = `距离 ${next.lottery.name} 开奖（${WEEK_NAMES[next.time.getDay()]} ${pad(next.time.getHours())}:${pad(next.time.getMinutes())}）`;
  }

  // ============ 初始化 ============
  renderToday();
  renderResults();
  renderSchedule();
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
